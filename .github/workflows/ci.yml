name: CI

# Runs on every pull request into main (so checks show up on the PR before
# merging) and on every push to main (so the merge commit itself is also
# verified). Deployment is handled separately by Render's own GitHub
# integration, which auto-deploys main after a merge — this workflow is
# the "CI" half only: lint + automated tests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
